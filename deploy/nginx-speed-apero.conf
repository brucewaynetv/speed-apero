# Speed Apéro — reverse proxy on VPS legeekshop
# Domain: speed-apero.gothamdev.fr → 127.0.0.1:3010
# SSL: /etc/letsencrypt/live/speed-apero.gothamdev.fr/ (certbot)

map $http_upgrade $speed_apero_connection {
  default upgrade;
  ""      close;
}

upstream speed_apero_app {
  server 127.0.0.1:3010;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name speed-apero.gothamdev.fr;

  client_max_body_size 20m;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name speed-apero.gothamdev.fr;

  ssl_certificate     /etc/letsencrypt/live/speed-apero.gothamdev.fr/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/speed-apero.gothamdev.fr/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  client_max_body_size 20m;

  location / {
    proxy_pass http://speed_apero_app;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $speed_apero_connection;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }
}
